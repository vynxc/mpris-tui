[package]
name = "mpris-tui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A transparent, click-only MPRIS now-playing TUI"
repository = "https://github.com/vynxc/mpris-tui"
license = "MIT"
keywords = ["mpris", "ratatui", "music", "terminal", "linux"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
signal-hook = "0.4"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

[dev-dependencies]
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
