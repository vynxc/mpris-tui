name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Linux x86_64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          install -Dm755 target/release/mpris-tui dist/mpris-tui
          tar -C dist -czf mpris-tui-linux-x86_64.tar.gz mpris-tui
          sha256sum mpris-tui-linux-x86_64.tar.gz > mpris-tui-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mpris-tui-linux-x86_64.tar.gz \
            mpris-tui-linux-x86_64.tar.gz.sha256 \
            --generate-notes \
            --title "MPRIS TUI ${GITHUB_REF_NAME}"
